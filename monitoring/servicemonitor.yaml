# =============================================================================
# Prometheus ServiceMonitor for CNPG Clusters
# =============================================================================
# Configures Prometheus (via prometheus-operator) to scrape CNPG PostgreSQL
# metrics from the built-in exporter on port 9187.
#
# Prerequisites:
#   - prometheus-operator / kube-prometheus-stack installed
#   - CNPG operator with monitoring enabled
#
# Apply:
#   kubectl apply -f monitoring/servicemonitor.yaml
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-cluster-metrics
  namespace: postgres
  labels:
    app: cnpg
    prometheus: kube-prometheus
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - postgres
      - postgres-dev
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cluster_name
        - sourceLabels: [__meta_kubernetes_pod_label_role]
          targetLabel: role
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
