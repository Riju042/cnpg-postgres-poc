# =============================================================================
# Prometheus Alerting Rules for CNPG PostgreSQL
# =============================================================================
# Alerts for replication lag, connection saturation, storage pressure,
# backup failures, and instance health.
#
# Apply:
#   kubectl apply -f monitoring/alerts.yaml
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-alerts
  namespace: postgres
  labels:
    app: cnpg
    prometheus: kube-prometheus
    release: kube-prometheus-stack
    role: alert-rules
spec:
  groups:
    # =========================================================================
    # Replication Alerts
    # =========================================================================
    - name: cnpg-replication
      rules:
        - alert: CNPGReplicationLagHigh
          expr: |
            cnpg_pg_replication_lag > 10
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "CNPG replication lag is high"
            description: >-
              Replication lag on {{ $labels.pod }} in cluster
              {{ $labels.cluster_name }} is {{ $value }}s
              (threshold: 10s for 5m).
            runbook_url: "https://wiki.internal/runbooks/cnpg-replication-lag"

        - alert: CNPGReplicationLagCritical
          expr: |
            cnpg_pg_replication_lag > 30
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "CNPG replication lag is critical"
            description: >-
              Replication lag on {{ $labels.pod }} in cluster
              {{ $labels.cluster_name }} is {{ $value }}s
              (threshold: 30s for 2m). Investigate immediately.

        - alert: CNPGReplicaNotStreaming
          expr: |
            cnpg_pg_replication_streaming == 0
          for: 3m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "CNPG replica is not streaming"
            description: >-
              Replica {{ $labels.pod }} in cluster {{ $labels.cluster_name }}
              has stopped streaming replication.

    # =========================================================================
    # Connection Alerts
    # =========================================================================
    - name: cnpg-connections
      rules:
        - alert: CNPGConnectionsHigh
          expr: |
            cnpg_pg_stat_activity_count / cnpg_pg_settings_setting{name="max_connections"}
            > 0.8
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "CNPG connection usage above 80%"
            description: >-
              Connection utilization on {{ $labels.pod }} in cluster
              {{ $labels.cluster_name }} is at {{ $value | humanizePercentage }}.

        - alert: CNPGConnectionsCritical
          expr: |
            cnpg_pg_stat_activity_count / cnpg_pg_settings_setting{name="max_connections"}
            > 0.95
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "CNPG connection usage above 95%"
            description: >-
              Connection utilization on {{ $labels.pod }} is at
              {{ $value | humanizePercentage }}. Risk of connection exhaustion.

        - alert: CNPGLongRunningQueries
          expr: |
            cnpg_pg_stat_activity_max_tx_duration_seconds > 300
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Long-running transaction detected"
            description: >-
              A transaction on {{ $labels.pod }} has been running for
              {{ $value | humanizeDuration }}.

    # =========================================================================
    # Storage Alerts
    # =========================================================================
    - name: cnpg-storage
      rules:
        - alert: CNPGStorageUsageHigh
          expr: |
            cnpg_pg_database_size_bytes
            / on(persistentvolumeclaim, namespace)
            kube_persistentvolumeclaim_resource_requests_storage_bytes
            > 0.8
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "CNPG storage usage above 80%"
            description: >-
              Database storage on {{ $labels.pod }} in cluster
              {{ $labels.cluster_name }} is above 80%. Plan capacity expansion.

        - alert: CNPGStorageUsageCritical
          expr: |
            cnpg_pg_database_size_bytes
            / on(persistentvolumeclaim, namespace)
            kube_persistentvolumeclaim_resource_requests_storage_bytes
            > 0.9
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "CNPG storage usage above 90%"
            description: >-
              Database storage on {{ $labels.pod }} is above 90%.
              Immediate action required to prevent data loss.

        - alert: CNPGWALStorageHigh
          expr: |
            cnpg_pg_wal_archive_status_last_archived_time_seconds_since > 600
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "WAL archiving is falling behind"
            description: >-
              WAL archiving on {{ $labels.pod }} hasn't archived in
              {{ $value | humanizeDuration }}. Check S3 connectivity.

    # =========================================================================
    # Backup Alerts
    # =========================================================================
    - name: cnpg-backups
      rules:
        - alert: CNPGBackupFailed
          expr: |
            cnpg_pg_stat_archiver_failed_count > 0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "CNPG WAL archiving failures detected"
            description: >-
              {{ $value }} WAL archiving failures on {{ $labels.pod }}.
              Backups may be incomplete.

        - alert: CNPGLastBackupTooOld
          expr: |
            time() - cnpg_pg_stat_archiver_last_archived_time > 86400
          for: 10m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "No successful backup in 24 hours"
            description: >-
              The last successful WAL archive on {{ $labels.pod }} was
              more than 24 hours ago.

    # =========================================================================
    # Instance Health Alerts
    # =========================================================================
    - name: cnpg-health
      rules:
        - alert: CNPGInstanceDown
          expr: |
            cnpg_collector_up == 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "CNPG instance is down"
            description: >-
              CNPG instance {{ $labels.pod }} in namespace
              {{ $labels.namespace }} is unreachable.

        - alert: CNPGInstanceNotReady
          expr: |
            cnpg_pg_stat_activity_count{state="active"} == 0
            and cnpg_collector_up == 1
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "CNPG instance has no active connections"
            description: >-
              Instance {{ $labels.pod }} is up but has zero active
              connections for 5 minutes.
